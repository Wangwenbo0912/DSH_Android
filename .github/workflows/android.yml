name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Unit Tests + Lint ────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission to scripts
        run: chmod +x tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*

  # ─── Code Coverage (JaCoCo) ──────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Run tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/build/reports/jacoco/'

      - name: Check coverage threshold
        if: always()
        run: |
          if [ -f build/reports/jacoco/jacoco.csv ]; then
            COVERAGE=$(awk -F',' 'NR>1 {covered+=$9+$11; missed+=$8+$10} END {printf "%.1f", covered/(covered+missed)*100}' build/reports/jacoco/jacoco.csv)
            echo "Overall code coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 30" | bc -l) )); then
              echo "::warning title=Low Coverage::Code coverage is ${COVERAGE}% — below 30% threshold."
            fi
          else
            echo "::warning title=No Coverage Report::JaCoCo report not found."
          fi

  # ─── Debug APK Build ───────────────────────────────────────────────────
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission to scripts
        run: chmod +x tools/*.sh

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            SIZE_MB=$(echo "scale=1; $SIZE / 1048576" | bc)
            echo "Debug APK size: ${SIZE_MB}MB"
            if (( $(echo "$SIZE_MB > 400" | bc -l) )); then
              echo "::warning title=Large APK::Debug APK is ${SIZE_MB}MB — check for unexpected assets."
            fi
          else
            echo "::error::Debug APK not found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ─── Dependency Vulnerability Scan ────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check npm dependencies
        run: |
          if [ -d runtime-bundle ]; then
            find runtime-bundle -name "package.json" -maxdepth 2 | while read pkg; do
              dir=$(dirname "$pkg")
              echo "--- npm audit: $dir ---"
              (cd "$dir" && npm audit --production --audit-level=high 2>/dev/null || echo "npm audit: review manually")
            done
          fi
      - name: Run Gradle dependency insight
        run: |
          echo "== Gradle dependencies (summary) =="
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null | tail -50 || true